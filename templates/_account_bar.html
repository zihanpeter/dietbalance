<nav class="account-bar" aria-label="账号">
    {% if current_user %}
        <span class="account-user">已登录 · <strong>{{ current_user.username }}</strong></span>
        <a class="account-link" href="{{ url_for('plan') }}">配餐方案</a>
        <form class="account-logout" action="{{ url_for('logout') }}" method="post">
            <button type="submit" class="btn btn-ghost btn-sm">退出</button>
        </form>
    {% else %}
        <a class="account-link" href="{{ url_for('login') }}">登录</a>
        <a class="btn btn-secondary btn-sm" href="{{ url_for('register') }}">注册</a>
    {% endif %}
</nav>
